name: Build Windows EXE

on:
  push:
    branches: ["arena/f660210d-festlauncher"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test
        shell: pwsh
        run: |
          cargo test --release 2>&1 | Tee-Object -FilePath cargo-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (Get-Content cargo-test.log -Tail 100) -join "`n"
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error::$tail"
            exit $code
          }
      - name: Build
        run: cargo build --release
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FestVisuals-Windows
          path: target/release/fest-launcher.exe
          if-no-files-found: error
